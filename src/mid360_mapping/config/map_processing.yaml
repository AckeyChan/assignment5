map_processor_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /mapping/map
    map_frame: map
    output_directory: maps
    voxel_size: 0.10
    grid_resolution: 0.10
    obstacle_height_min: 0.15
    obstacle_height_max: 1.50
    sor_enabled: false
    sor_mean_k: 0
    sor_stddev_multiplier: 0.0
    radius_enabled: false
    radius_search: 0.0
    radius_min_neighbors: 0
# Starting values only: determine suitable thresholds from the gravity-aligned map.
# Outlier-filter thresholds are intentionally unset until tuned; empty grid cells are published as free.
