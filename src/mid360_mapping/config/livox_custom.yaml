mapping_node:
  ros__parameters:
    use_sim_time: true
    input_type: livox_custom
    lidar_topic: /livox/lidar
    imu_topic: /livox/imu
    fastlio_world_frame: camera_init
    gravity_align: true
    gravity_sample_count: 200
    map_frame: map
    body_frame: body
    map_output_path: maps/fastlio_map.pcd
# Requires sourced livox_ros_driver2 message type support even for generic reception.
